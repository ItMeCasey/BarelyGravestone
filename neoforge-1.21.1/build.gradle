plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir "../version-1.21.1/src/main/java"
        java.srcDir "../common/src/main/java"
        resources.srcDir "../version-1.21.1/src/main/resources"
        resources.srcDir "../common/src/main/resources"
    }
}

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
            if (project.hasProperty('devTools')) { systemProperty 'barelygravestone.dev', 'true' }
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // The headless self test runs here (no EULA needed): barelygravestone.selftest starts it once the server is up.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'barelygravestone.selftest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// neoforge.mods.toml is a template: this fills in its ${} values from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version_range: neo_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Unit tests for the shared logic (food math, comparator ranking); they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
// Development tools (self test, screenshot tour) live in src/dev and only build with -PdevTools, so a normal build and the
// release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-1.21.1/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
    sourceSets.main.resources.srcDir '../version-1.21.1/src/dev/resources'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// --- Map mod integration: JourneyMap (optional, compile-only API; nothing of it ships) ---
// The API comes from JourneyMap's own Maven. -Pmapmod=journeymap adds the real mod to the dev client (from CurseForge via the
// ItMeCasey mirror when its login is set, else Cursemaven).
repositories {
    maven {
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
        content { includeGroup 'info.journeymap' }
    }
    def imcUser = System.getenv('IMC_MAVEN_USER') ?: project.findProperty('imcMavenUser')
    def imcPass = System.getenv('IMC_MAVEN_PASSWORD') ?: project.findProperty('imcMavenPassword')
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey mirror'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
            content { includeGroup 'curse.maven' }
        }
    }
    maven {
        name = 'Cursemaven (fallback)'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    compileOnly "info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1-SNAPSHOT"
}
if (project.hasProperty('mapmod')) {
    dependencies {
        runtimeOnly "curse.maven:journeymap-32274:8923668"
    }
}

// -Pteammod=opac adds Open Parties and Claims to the dev run, to check the soft link to it (nothing of it ships).
if (project.hasProperty('teammod')) {
    dependencies {
        runtimeOnly "curse.maven:open-parties-and-claims-636608:9221991"
    }
}
