plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

base.archivesName = "${mod_id}-forge-mc${minecraft_version}"
version = mod_version
group = mod_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    test {
        java.srcDir '../common/src/test/java'
    }
    main {
        java.srcDir '../version-1.20.1/src/main/java'
        java.srcDir '../common/src/main/java'
        resources.srcDir '../version-1.20.1/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            if (project.hasProperty('devTools')) { property 'barelygravestone.dev', 'true' }
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            // -PwindowSize=1904x1041 opens the dev client at that size (the screenshot checks need the same layout every run).
            if (project.hasProperty('windowSize')) {
                args '--width', project.property('windowSize').split('x')[0], '--height', project.property('windowSize').split('x')[1]
            }
        }
        server {
            args '--nogui'
        }
        // The headless self test runs here (no EULA needed): barelygravestone.selftest starts it once the server is up.
        gameTestServer {
            property 'barelygravestone.selftest', 'true'
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

}

// Fills in mods.toml and pack.mcmeta from gradle.properties, the same way the NeoForge builds fill in neoforge.mods.toml.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        forge_version: forge_version, forge_version_range: forge_version_range, loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : mod_authors,
        ])
    }
    // 1.20.1 runs on SRG names, so the jar is remapped.
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Unit tests for the shared logic; they need no running game.
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
// Development tools (self test, screenshot tour) live in src/dev and only build with -PdevTools, so a normal build and the
// release jars never contain them.
if (project.hasProperty('devTools')) {
    sourceSets.main.java.srcDir '../version-1.20.1/src/dev/java'
    sourceSets.main.java.srcDir 'src/dev/java'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// --- Map mod integration: JourneyMap (optional, compile-only API; nothing of it ships) ---
// JourneyMap 5.9 and 6 on 1.20.1 use API 1.x, from JourneyMap's own Maven. -Pmapmod=journeymap adds the real mod to the dev
// client (from CurseForge via the ItMeCasey mirror when its login is set, else Cursemaven).
repositories {
    maven {
        name = 'JourneyMap'
        url = 'https://jm.gserv.me/repository/maven-public/'
        content { includeGroup 'info.journeymap' }
    }
    def imcUser = System.getenv('IMC_MAVEN_USER') ?: project.findProperty('imcMavenUser')
    def imcPass = System.getenv('IMC_MAVEN_PASSWORD') ?: project.findProperty('imcMavenPassword')
    if (imcUser && imcPass) {
        maven {
            name = 'ItMeCasey mirror'
            url = 'https://itmecasey.com/maven'
            credentials { username = imcUser; password = imcPass }
            content { includeGroup 'curse.maven' }
        }
    }
    maven {
        name = 'Cursemaven (fallback)'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}
dependencies {
    compileOnly "info.journeymap:journeymap-api:1.20-1.9-SNAPSHOT"
}
if (project.hasProperty('mapmod') && project.property('mapmod') == 'journeymap') {
    dependencies {
        runtimeOnly fg.deobf("curse.maven:journeymap-32274:9049826")
    }
}

// --- Map mod integration: Antique Atlas (optional, compile-only; nothing of it ships) ---
// -Pmapmod=antiqueatlas adds the real mod to the dev client.
dependencies {
    compileOnly "curse.maven:antique-atlas-227795:6849138"
}
if (project.hasProperty('mapmod') && project.property('mapmod') == 'antiqueatlas') {
    dependencies {
        runtimeOnly fg.deobf("curse.maven:antique-atlas-227795:6849138")
    }
}
